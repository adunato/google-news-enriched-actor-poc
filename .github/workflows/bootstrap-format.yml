name: Bootstrap format artifacts

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format bootstrap artifacts
        run: npx prettier --write README.md docs/architecture.md docs/product.md .codex/templates/low-level-design.md

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture.md docs/product.md .codex/templates/low-level-design.md
          git commit -m "Format bootstrap artifacts"
          git push origin HEAD:dev
