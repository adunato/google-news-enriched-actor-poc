name: Notify SideGig learning collector

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch SideGig collector
        env:
          SIDEGIG_COLLECTOR_DISPATCH_TOKEN: ${{ secrets.SIDEGIG_COLLECTOR_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$SIDEGIG_COLLECTOR_DISPATCH_TOKEN" ]; then
            echo "::error::SIDEGIG_COLLECTOR_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          payload=$(printf '{"ref":"main","inputs":{"source_repository":"%s"}}' "$SOURCE_REPOSITORY")

          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $SIDEGIG_COLLECTOR_DISPATCH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/adunato/SideGig/actions/workflows/collect-learnings.yml/dispatches             -d "$payload"
